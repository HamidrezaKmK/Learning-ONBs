# @package _global_
# FPCA on the Implicit-Zoo CIFAR-10 SIREN dataset (3-channel RGB).
#
# Usage:
#   python fpca.py +fpca_experiment=implicit_zoo_cifar_eulerian
#   python fpca.py +fpca_experiment=implicit_zoo_cifar_eulerian wandb=enabled wandb.run_name=cifar_inr_fpca
#
# Before running, download and extract the Implicit-Zoo CIFAR-10 data as described in
#   conf/function_generator/implicit_zoo_cifar.yaml
defaults:
  - /function_generator@function_generator: implicit_zoo_cifar
  - /neural_isometry@neural_isometry: eulerian
  - _self_

function_generator:
  n_inrs: 1024
  domain_sample_size: 64

# The INR FPCA notebook instantiates this directly for held-out diagnostics.
ood_function_generator:
  _target_: infidictionary.datasets.ImplicitZooCIFARDataset
  extracted_dir: data/cifar_inrs_dataset
  split: eval
  domain_sample_size: 64
  n_inrs: 200
  omega_0: 30.0
  omega: 30.0
  device: auto  # CUDA when available; SIREN evaluation dominates step time on CPU
ood_label: "CIFAR-10 eval split"

# ── Isometry ──────────────────────────────────────────────────────────────────
neural_isometry:
  channels_dim: 3        # RGB: 3 output channels
  rank: 30
  base_acceleration: 10.

# ── Fourier dictionary: 3 channels (R, G, B) ──────────────────────────────────
initial_dictionary:
  num_channels: 3
  steepness: 1.01        # shallow decay → more high-freq atoms sampled

# ── Mean function: 3-channel output ───────────────────────────────────────────
mean_function:
  output_dim: 3

# ── ODE integrator ────────────────────────────────────────────────────────────
model_state_kwargs:
  num_steps: 20

pullback_pushforward_kwargs:
  rot_start_time: 0.0
  rot_end_time: 1.0

# ── Training ──────────────────────────────────────────────────────────────────
n_epochs: 1000
n_epochs_mean_function: null
batch_size: 32
grad_accumulation_steps: 16
max_grad_norm: 1.0

isometry_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 5.0e-4
  _partial_: true

mean_function_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 1.0e-3
  _partial_: true

# ── Energy estimation ─────────────────────────────────────────────────────────
energy_estimation_kwargs:
  num_tail_samples: 32
  tail_probability: 1.0e-4

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpointing:
  checkpoint_dir: outputs/checkpoints
  checkpoint_every_n_steps: 100
  checkpoint_window_size: 1000 # store all checkpoints

# ── W&B tags ──────────────────────────────────────────────────────────────────
wandb:
  project: BasisLearning-FPCA
  tags:
    dataset: implicit_zoo_cifar
    isometry: eulerian
