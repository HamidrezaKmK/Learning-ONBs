# @package _global_
defaults:
  - /domain_samplers@domain_sampler: square_sampler   # used by callbacks
  - /function_generator@function_generator: celeba
  - /neural_isometry@neural_isometry: eulerian
  - _self_


function_generator:
  resolution: 64
  n_images: 32
  drop_fraction: 0.75
  n_drop_draws: 100
  grayscale: True

# ── 1-channel overrides ───────────────────────────────────────────────────────

# Eulerian isometry must match the signal channel count
neural_isometry:
  channels_dim: 1
  rank: 10
  base_acceleration: 1000.
  scalar_field_partial: null # remove the residual term entirely
  atom_shuffling_K: 10
  use_power_law: True

# Fourier dictionary: 1 output channel.  Atoms are indexed by (k_1, k_2, 0).
initial_dictionary:
  num_channels: 1
  steepness: 2.0
  tiebreak_eps: 1.0e-3

# Mean function outputs one value (luminance) per pixel
mean_function:
  output_dim: 1

# ── Training hyperparameters ──────────────────────────────────────────────────
model_state_kwargs:
  num_steps: 20 # NOTE: very important for FPCA


checkpointing:
  checkpoint_dir: outputs/checkpoints
  checkpoint_every_n_steps: 2


tail_probability: 0.0001
num_tail_samples: 32
n_epochs: 500000
n_epochs_mean_function: null  # freeze mean function after this many epochs (null = never)
batch_size: 16
grad_accumulation_steps: 2
max_grad_norm: 1.0

wandb:
  project: BasisLearning-FPCA
  tags:
    dataset: celeba_grayscale
