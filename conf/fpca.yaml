defaults:
  - neural_fields@mean_function: mlp
  - hydra: default
  - wandb: disabled # set to enabled for wandb logging
  - /energy_estimation_kwargs@energy_estimation_kwargs: monte_carlo
  - /dictionaries@initial_dictionary: fourier_2d
  - _self_
  - override hydra/hydra_logging: none # hack to fix the logging code
  - override hydra/job_logging: none # hack to fix the logging code

mean_function_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true
mean_function_schedular_callable: null

isometry_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true
isometry_scheduler_callable: null


pullback_pushforward_kwargs:
  start_time: 0.0
  end_time: 1.0

wandb:
  tags:
    experiment: fpca
    task: reconstruction

# training hyperparameters
n_epochs: 500000
domain_sample_size: 32
n_functions: 1000
batch_size: 128
grad_accumulation_steps: 1

resume_training:
  enabled: false
  checkpoint_path: null  # absolute path to a checkpoint .pt file

checkpointing:
  checkpoint_dir: outputs/checkpoints  # relative to Hydra output dir
  checkpoint_every_n_steps: 1000  # optimizer steps between periodic saves
  checkpoint_window_size: 3       # number of periodic checkpoints to keep

