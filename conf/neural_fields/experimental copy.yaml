_target_: infidictionary.networks.DistortedField

inner_field_partial: 
  _target_: infidictionary.networks.OldTimeEvolvingField
  _partial_: true
  # coords_dim and output_dim are injected by EulerianIsometry via _partial_

  spatial_hidden_dims:
    - 256
    - 256
    - 256
    - 256
  time_hidden_dims:
    - 256
    - 256
  feature_dim: 256
  use_fourier_features: true
  n_fourier_features: 256
  fourier_sigma: 5.0  # high sigma biases v(t,x) to very high spatial freq
  n_time_freqs: 16
  post_combination_dims:
    - 64
  activation:
    _target_: torch.nn.SiLU
    _partial_: true


  adaptive_modulation: True
  freq_hidden_dims:
    - 256
    - 256

initial_dictionary: InfiDictionary,
bandwidth: 2
learnable: True
time_hidden_dims:
  - 256
  - 256
n_time_freqs: 16
low_freq: 0
high_freq: 128.
low_t: 0.0
high_t: 1.0
activation:
  _target_: torch.nn.SiLU
  _partial_: true
