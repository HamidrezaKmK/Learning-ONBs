_target_: infidictionary.utils.FactoredTimeEvolvingField
# coords_dim and output_dim are injected by EulerianIsometry via _partial_

spatial_hidden_dims:
  - 256
  # - 256
  # - 256
  - 256
time_hidden_dims:
  - 256
  - 256
feature_dim: 256
use_fourier_features: true
n_fourier_features: 64
fourier_sigma: 10.0
n_time_freqs: 8
post_combination_dims:
  - 64
activation:
  _target_: torch.nn.ReLU
  _partial_: true
