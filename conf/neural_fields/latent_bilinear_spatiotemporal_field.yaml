_target_: infidictionary.networks.LatentBilinearSpatiotemporalField
# coords_dim and output_dim are injected by EulerianIsometry via _partial_

spatial_hidden_dims:
  - 256
  - 256
  - 256
  - 256
time_hidden_dims:
  - 256
  - 256
feature_dim: 256
use_fourier_features: true
n_fourier_features: 256
fourier_sigma: 5.0  # high sigma biases v(t,x) to very high spatial freq
n_time_freqs: 16
post_combination_dims:
  - 64
activation:
  _target_: torch.nn.SiLU
  _partial_: true

