# @package _global_
#
# SDS-based concept basis: learn a basis whose random K-sparse linear
# combinations render as a target concept, using Score Distillation Sampling.
#
# Usage:
#   python concept_basis.py +concept_experiment=sds
#   python concept_basis.py +concept_experiment=sds wandb=enabled

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: latent_bilinear_spatiotemporal_field
  - override /coefficient_model@coefficient_model: spike_and_slab
  - _self_

# caption: "french mathematician, Joseph Fourier"
caption: "Marilyn Diptych, by Andy Warhol"

neural_isometry:
  channels_dim: 3
  rank: 50
  base_acceleration: 1000.
  atom_shuffling_K: 6
  use_power_law: True

model_state_kwargs:
  num_steps: 20

concept_loss:
  _target_: infidictionary.concept.SDSLoss
  model_id: "runwayml/stable-diffusion-v1-5"
  guidance_scale: 50.0
  t_range: [0.02, 0.98]
  render_size: 512
  n_augmentation_trials: 0
  t_batch_size: 1
  weighted_loss: false

mean_function: null

initial_dictionary:
  steepness: 2.0
  tiebreak_eps: 1.0e-3

tail_probability: 1e-3
num_tail_samples: 64
batch_size: 1
grad_accumulation_steps: 16
max_grad_norm: 1.0
variation_strength: 1.0

n_epochs: 10000

checkpointing:
  checkpoint_dir: outputs/checkpoints
  checkpoint_every_n_steps: 2

wandb:
  project: BasisLearning-ConceptBasis
  tags:
    concept: joseph_fourier
    method: SDS
