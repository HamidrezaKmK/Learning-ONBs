# @package _global_
#
# SDS-based concept basis: learn a basis whose random K-sparse linear
# combinations render as a cat, using Score Distillation Sampling.
#
# Usage:
#   python concept_basis.py +concept_experiment=sds_cat
#   python concept_basis.py +concept_experiment=sds_cat wandb=enabled

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: old # might change to old, but currently using factored
  - _self_

caption: "A painting in the style of Vincent Van Gogh"

concept_loss:
  _target_: infidictionary.concept.SDSLoss
  model_id: "runwayml/stable-diffusion-v1-5"
  guidance_scale: 50.0
  t_range: [0.02, 0.98]
  render_size: 512
  n_augmentation_trials: 0
  t_batch_size: 1
  weighted_loss: false

variation_strength: 1.0
K: 2
coefficient_decay: 0.5
batch_size: 2
grad_accumulation_steps: 16
mean_function: null

