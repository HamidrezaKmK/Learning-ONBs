# @package _global_
#
# SDS-based concept basis: learn a basis whose random K-sparse linear
# combinations render as a cat, using Score Distillation Sampling.
#
# Usage:
#   python concept_basis.py +concept_experiment=dreanfusion_cat
#   python concept_basis.py +concept_experiment=dreamfusion_cat wandb=enabled

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: factored
  - _self_

caption: "a cat"

concept_loss:
  _target_: infidictionary.concept.SDSLoss
  model_id: "runwayml/stable-diffusion-v1-5"
  guidance_scale: 50. # TODO: check if cranking this high up makes sense; otherwise switch to 7.5 or something that SD-1.5 uses
  t_range: [0.02, 0.98]
  render_size: 512
  mode: direct
  n_augmentation_trials: 0

K: 2
coefficient_decay: 0.5
batch_size: 1
grad_accumulation_steps: 1

