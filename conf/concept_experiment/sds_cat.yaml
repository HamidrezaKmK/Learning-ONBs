# @package _global_
#
# SDS-based concept basis: learn a basis whose random K-sparse linear
# combinations render as a cat, using Score Distillation Sampling.
#
# Usage:
#   python concept_basis.py +concept_experiment=sds_cat
#   python concept_basis.py +concept_experiment=sds_cat wandb=enabled

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: old # experimental2 # old
  - override /coefficient_model@coefficient_model: spike_and_slab
  - _self_

caption: "a cat in the center of the image"

neural_isometry:
  acceleration: 500

concept_loss:
  _target_: infidictionary.concept.SDSLoss
  model_id: "runwayml/stable-diffusion-v1-5"
  guidance_scale: 50.0
  t_range: [0.02, 0.98]
  render_size: 512
  n_augmentation_trials: 0
  t_batch_size: 1
  weighted_loss: false

mean_function: null

initial_dictionary:
  p: 0.05

tail_probability: 1e-3
num_tail_samples: 64
batch_size: 2
grad_accumulation_steps: 16

