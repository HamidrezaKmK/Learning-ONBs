_target_: infidictionary.datasets.BasisRandomGenerator
domain_sampler:
  _target_: infidictionary.domain_samplers.SquareSampler
  stratified: true
  add_noise: true
  height: 1.0
  width: 1.0
domain_sample_size: 32
n_functions: 1000
dictionary:
  _target_: infidictionary.dictionaries.FourierDictionary
  domain_dim: 2
  num_channels: 1
  steepness: 2.0
  tiebreak_eps: 1.0e-3
atom_indices:
  - [ 0,  0, 0]
  - [ 1,  0, 0]
  - [ 0,  1, 0]
  - [-1,  0, 0]
  - [ 0, -1, 0]
diffeomorphism: null
