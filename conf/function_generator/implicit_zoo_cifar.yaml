_target_: infidictionary.datasets.ImplicitZooCIFARDataset
# The archive must be extracted once before training; the loader reads only the
# resulting checkpoint files and never accesses the archive at runtime.
# Download: https://www.kaggle.com/datasets/alexanderqi/cifar10-inrs-dataset
#   kaggle datasets download -d alexanderqi/cifar10-inrs-dataset
#   unzip data/archive.zip -d data/
#   → data/cifar_inrs_dataset/{train,eval}/ckpts/
extracted_dir: data/cifar_inrs_dataset
split: train           # 'train' (50 000 INRs) or 'eval' (10 000 INRs)
# n_per_dim=32 → 32² = 1024 coords per step (matches CIFAR-10 32×32 native resolution)
domain_sample_size: 32
n_inrs: null           # null = all 50 000 training INRs; set a number to limit
omega_0: 30.0
omega: 30.0
device: auto  # CUDA when available; SIREN evaluation dominates step time on CPU
