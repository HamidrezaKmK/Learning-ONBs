# @package _global_
defaults:
  - /domain_samplers@domain_sampler: square_sampler
  - /function_generator@function_generator: fourier_2d
  - /energy_estimation_kwargs@energy_estimation_kwargs: monte_carlo
  - /neural_isometry@neural_isometry: eulerian
  - /dictionaries@initial_dictionary: fourier_2d
  - override /wandb@wandb: disabled
  - _self_

model_state_kwargs:
  num_steps: 200

batch_size: 128
grad_accumulation_steps: 1

# training hyperparameters
n_epochs: 50000
domain_sample_size: 32
n_functions: 1000

pullback_pushforward_kwargs: 
  start_time: 0.0
  end_time: 1.0

callbacks:
  mean_function_visualization:
    _target_: infidictionary.callbacks.VisualizeMeanFunction
    initial_dictionary: ${initial_dictionary}
    domain_sampler: ${domain_sampler}
    frequency: 500
    density: 200
  reconstruction_visualization:
    _target_: infidictionary.callbacks.VisualizeKLExpansionReconstruction
    dictionary: ${initial_dictionary}
    domain_sampler: ${domain_sampler}
    f_gen: ${function_generator}
    seeds: [0, 1, 2]
    frequency: 500
    density: 200
    truncation_factors: [1, 2, 3]
    pullback_pushforward_kwargs: ${pullback_pushforward_kwargs}
    identity_isometry:
      _target_: infidictionary.neural_isometries.IdentityIsometry
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler: ${domain_sampler}
    frequency: 500
    density: 200
    indices:
      - [-1, 1]
      - [0, 0]
      - [1, -1]
      - [2, -2]
      - [3, -3]
    

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: fpca
    task: reconstruction
