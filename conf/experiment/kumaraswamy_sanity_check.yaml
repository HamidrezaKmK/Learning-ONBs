# @package _global_
# A toy example where a simple flow is used
# also the dataset is constructed from the first 6 Fourier basis functions in 2D
# that are mixed, also, the initial basis are the same Fourier basis functions
# this means that the optimal solution is the identity diffeomorphism
defaults:
  - override /function_generator@function_generator: fourier_2d
  - override /diffeomorphisms@diffeomorphism: kumaraswamy
  - override /dictionaries@initial_atoms: fourier_2d
  - override /wandb@wandb: enabled
  - _self_

_indices: [0, 1, 2, 3, 4, 5]

optimizer:
  lr: 0.001

initial_atoms:
  atom_indices: ${_indices}
function_generator: 
  dictionary:
    atom_indices: ${_indices}

# training hyperparameters
n_epochs: 50_000
domain_sample_size: 5000
n_functions: 1000
explained_variance_smoothing_alpha: 0.99

callbacks:
  reconstruction_visualization:
    _target_: infidictionary.callbacks.VisualizeReconstruction
    dictionary: ${initial_atoms}
    f_gen: ${function_generator}
    seeds: [10, 20, 30]
    frequency: 50
    density: 1000_00
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_atoms}
    frequency: 50
    density: 1000_00

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: kumaraswamy_sanity_check
    task: reconstruction
