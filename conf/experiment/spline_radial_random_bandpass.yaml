# @package _global_
# random bandpass learning using a spline flow on the radial domain
defaults:
  - override /function_generator@function_generator: random_bandpass
  - override /diffeomorphisms@diffeomorphism: spline_flow_radial
  - override /dictionaries@initial_atoms: mix1_radial
  - override /wandb@wandb: enabled
  - _self_

function_generator:
  radial: true

# training hyperparameters
n_epochs: 50_000
domain_sample_size: 5000
n_functions: 1000
energy_smoothing_alpha: 0.99

callbacks:
  reconstruction_visualization:
    _target_: infidictionary.callbacks.VisualizeReconstruction
    dictionary: ${initial_atoms}
    f_gen: ${function_generator}
    seeds: [10, 20, 30]
    frequency: 50
    density: 1000_00
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_atoms}
    frequency: 50
    density: 1000_00

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: spline_radial_random_bandpass
    task: reconstruction
