# @package _global_
defaults:
  - _self_

material:
  _target_: infidictionary.material.AirplaneMaterial
  length: 2.0
  min_diffusivity: 0.1
  max_diffusivity: 1.0

# Isometry-check domain sampler must match the airplane domain
callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler:
      _target_: infidictionary.domain_samplers.SquareSampler
    frequency: 100
    density: 1000
    indices:
      - [ 0,  0, 0]
      - [-1,  0, 0]
      - [ 0, -1, 0]
      - [ 1,  0, 0]
      - [ 0,  1, 0]

wandb:
  tags:
    experiment: vibrational_modes
    material: airplane_constant
