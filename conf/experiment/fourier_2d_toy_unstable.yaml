# @package _global_
defaults:
  - override /function_generator@function_generator: fourier_2d # the forward problem
  - override /diffeomorphism@diffeomorphism: kumaraswamy_unstable
  - override /bases@initial_basis: fourier_2d
  - override /wandb@wandb: enabled
  - _self_

function_generator:
  basis_indices: [0, 1]
initial_basis_indices: [0, 1]

# training hyperparameters
n_epochs: 5000_00
domain_sample_size: 1000
n_functions: 5
loss_smoothing_alpha: 0.0

callbacks:
  reconstruction_visualization:
    _target_: basis_learning.callbacks.VisualizeReconstruction
    basis: ${initial_basis}
    indices: [0, 1]
    f_gen: ${function_generator}
    seeds: [0, 1, 2]
    frequency: 1000
    density: 1000_00

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: fourier_2d
    task: reconstruction
    stable: false
