# @package _global_
defaults:
  - override /diffeomorphism@diffeomorphism: kumaraswamy
  - override /bases@initial_basis: mix_toy
  - override /wandb@wandb: enabled
  - _self_

function_generator:
  _target_: basis_learning.datasets.BasisRandomGenerator
  basis:
    _target_: basis_learning.bases.FourierBasis
    basis_indices: [0, 1, 2, 3]


# training hyperparameters
n_epochs: 50_000_000
domain_sample_size: 5000
n_functions: 1000
loss_smoothing_alpha: 0.99

callbacks:
  reconstruction_visualization:
    _target_: basis_learning.callbacks.VisualizeReconstruction
    basis: ${initial_basis}
    f_gen: ${function_generator}
    seeds: [10, 20, 30]
    frequency: 1000
    density: 1000_00
  isometry_check:
    _target_: basis_learning.callbacks.IsometryCheck
    basis: ${initial_basis}
    frequency: 1000
    density: 1000_00

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: fourier_2d
    task: reconstruction
