# @package _global_
#
# Regularized change-of-basis experiment using the TVMaterialRegularizer with
# a ConstantMaterial (mass = 1 everywhere).
#
# The regularizer applies a TV penalty on all atoms uniformly across the whole
# domain, with no parity or mask selection.  This promotes piecewise-constant
# pushed-forward atom functions globally.
#
# Usage:
#   python regularized_change_of_basis.py +experiments=constant_reg_cob
defaults:
  - override /regularizer: tv_constant
  - _self_

# Stratified sampling: keep the exact stratum small (high-pmf atoms are few)
# and rely on the MC tail for coverage.
tail_probability: 0.0001
num_tail_samples: 32
grad_accumulation_steps: 8

# Balance between isometry fidelity and the spatial-constancy regularizer.
fidelity_lambda: 0.001
reg_lambda: 1.0

n_epochs: 200000
domain_sample_size: 64

callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler: ${domain_sampler}
    frequency: 500
    density: 100
    indices:
      - [ 0,  0, 0]
      - [ 1,  0, 0]
      - [ 0,  1, 0]
      - [-1,  0, 0]
      - [ 0, -1, 0]

wandb:
  tags:
    experiment: regularized_change_of_basis
    regularizer: constant_tv
