# @package _global_
# A spline flow used to learn the identity map
defaults:
  - override /diffeomorphism@diffeomorphism: spline_flow
  - override /bases@initial_basis: mix1
  - override /wandb@wandb: enabled
  - _self_

function_generator:
  _target_: basis_learning.datasets.BasisRandomGenerator
  basis: ${initial_basis}


# training hyperparameters
n_epochs: 50_000_000
domain_sample_size: 5000
n_functions: 1000
loss_smoothing_alpha: 0.99

callbacks:
  reconstruction_visualization:
    _target_: basis_learning.callbacks.VisualizeReconstruction
    basis: ${initial_basis}
    f_gen: ${function_generator}
    seeds: [10, 20, 30]
    frequency: 5000
    density: 1000_00
  isometry_check:
    _target_: basis_learning.callbacks.IsometryCheck
    basis: ${initial_basis}
    frequency: 5000
    density: 1000_00

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: spline_sanity_check
    task: reconstruction
