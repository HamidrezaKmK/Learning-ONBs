# @package _global_
# A spline flow used to learn the identity map
defaults:
  - override /diffeomorphism@diffeomorphism: spline_flow
  - override /dictionaries@initial_atoms: mix1
  - override /wandb@wandb: enabled
  - _self_

function_generator:
  _target_: infidictionary.datasets.BasisRandomGenerator
  dictionary: ${initial_atoms}


# training hyperparameters
n_epochs: 50_000_000
domain_sample_size: 5000
n_functions: 1000
loss_smoothing_alpha: 0.99

callbacks:
  reconstruction_visualization:
    _target_: infidictionary.callbacks.VisualizeReconstruction
    dictionary: ${initial_atoms}
    f_gen: ${function_generator}
    seeds: [10, 20, 30]
    frequency: 100
    density: 1000_00
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_atoms}
    frequency: 100
    density: 1000_00

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: spline_sanity_check
    task: reconstruction
