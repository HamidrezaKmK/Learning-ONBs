defaults:
  - neural_isometry: eulerian
  - /dictionaries@initial_dictionary: fourier_2d
  - /domain_samplers@domain_sampler: square_sampler
  - regularizer: fourierer
  - hydra: default
  - wandb: disabled # set to enabled for wandb logging
  - _self_
  - override hydra/hydra_logging: none # hack to fix the logging code
  - override hydra/job_logging: none # hack to fix the logging code

isometry_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true
isometry_scheduler_callable: null

pushforward_kwargs:
  start_time: 0.0
  end_time: 1.0

model_state_kwargs:
  num_steps: 200

tail_probability: 0.0001
num_tail_samples: 32
grad_accumulation_steps: 1

resume_training:
  enabled: false
  checkpoint_path: null  # absolute path to a checkpoint .pt file

checkpointing:
  checkpoint_dir: outputs/checkpoints  # relative to Hydra output dir
  checkpoint_every_n_steps: 100  # optimizer steps between periodic saves
reg_lambda: 1.0
fidelity_lambda: 1.0

# training hyperparameters
n_epochs: 500000
domain_sample_size: 32

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: regularized_change_of_basis
    task: fourierer
