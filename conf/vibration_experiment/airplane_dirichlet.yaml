# TODO: this is not working
# @package _global_
#
# Vibrational-modes experiment on the airplane material using the
# DirichletEnergyRegularizer (finite-difference gradient estimate).
#
# Minimises E_a = ∫ D(x) ‖∇(Qφ_a)(x)‖² dx, which finds the eigenfunctions
# of -∇·(D(x)∇) — the vibrational modes of the material.
#
# Usage:
#   python reg_cob.py +vibration_experiment=airplane_dirichlet
defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: old
  - _self_

initial_dictionary:
  num_channels: 1
  p: 0.1

neural_isometry:
  channels_dim: 1

model_state_kwargs:
  num_steps: 50

tail_probability: 0.0007
num_tail_samples: 32
grad_accumulation_steps: 1

regularizer:
  _target_: infidictionary.regularizers.DirichletEnergyRegularizer
  finite_diff_h: 1.0e-3
  n_fd_dirs: 4
  material:
    _target_: infidictionary.material.AirplaneMaterial
    length: 2.0
    min_diffusivity: 1.0
    max_diffusivity: 1.0
    exterior_mass: 0.01
  domain_sampler:
    _target_: infidictionary.domain_samplers.SquareSampler
    stratified: true
    add_noise: true
  domain_sample_size: 32

callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler:
      _target_: infidictionary.domain_samplers.SquareSampler
    frequency: 100
    density: 100
    indices:
      - [ 0,  0, 0]
      - [-1,  0, 0]
      - [ 0, -1, 0]
      - [ 1,  0, 0]
      - [ 0,  1, 0]

wandb:
  project: BasisLearning-vibration-modes
  tags:
    material: airplane
    method: finite-difference-dirichlet
