# @package _global_
#
# Vibrational-modes experiment on the Joseph Fourier portrait material, using
# the HeatQuadraticFormRegularizer via reg_cob.py.
#
# Usage:
#   python reg_cob.py +vibration_experiment=joseph_vibration
defaults:
  - _self_

material:
  _target_: infidictionary.material.JosephFourierMaterial
  image_path: assets/Joseph_Fourier.jpg
  image_size: 256
  interior_diffusivity: 0.1
  exterior_diffusivity: 1.0
  invert: False
  threshold: 0.5
  sigma: 0.002
  exterior_mass: 0.1

regularizer:
  _target_: infidictionary.regularizers.HeatQuadraticFormRegularizer
  smoothing_t: 0.05
  n_diffusion_samples: 4
  material: ${material}
  masking_weight: 1.0
  mass_threshold: 0.5
  domain_sampler:
    _target_: infidictionary.domain_samplers.SquareSampler
    stratified: true
    add_noise: true
  domain_sample_size: 32

callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler:
      _target_: infidictionary.domain_samplers.SquareSampler
    frequency: 100
    density: 1000
    indices:
      - [ 0,  0, 0]
      - [-1,  0, 0]
      - [ 0, -1, 0]
      - [ 1,  0, 0]
      - [ 0,  1, 0]

wandb:
  project: BasisLearning-vibration-modes
  tags:
    material: joseph
    method: heat_qform
