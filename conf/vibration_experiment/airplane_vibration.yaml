# @package _global_
#
# Vibrational-modes experiment on the airplane material, using the
# HeatQuadraticFormRegularizer via reg_cob.py.
#
# Usage:
#   python reg_cob.py +vibration_experiment=airplane_vibration

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: experimental2 # old # fourier_mixture # old # fourier_mixture
  - _self_

initial_dictionary:
  num_channels: 1
  p: 0.1

neural_isometry:
  channels_dim: 1

model_state_kwargs:
  num_steps: 200

tail_probability: 0.0007
num_tail_samples: 32
grad_accumulation_steps: 1 # 8
max_grad_norm: 1.0

regularizer:
  _target_: infidictionary.regularizers.HeatQuadraticFormRegularizer
  smoothing_t: 0.01
  n_diffusion_samples: 4
  material: 
    _target_: infidictionary.material.AirplaneMaterial
    length: 2.0
    min_diffusivity: 1.000
    max_diffusivity: 0.001
    exterior_mass: 1. # 0.01
  masking_weight: 0
  mass_threshold: 0.5
  domain_sampler:
    _target_: infidictionary.domain_samplers.SquareSampler
    stratified: true
    add_noise: true
  domain_sample_size: 32

# Isometry-check domain sampler must match the airplane domain
# callbacks:
#   isometry_check:
#     _target_: infidictionary.callbacks.IsometryCheck
#     dictionary: ${initial_dictionary}
#     domain_sampler:
#       _target_: infidictionary.domain_samplers.SquareSampler
#     frequency: 100
#     density: 100
#     indices:
#       - [ 0,  0, 0]
#       - [-1,  0, 0]
#       - [ 0, -1, 0]
#       - [ 1,  0, 0]
#       - [ 0,  1, 0]

checkpointing:
  checkpoint_dir: outputs/checkpoints
  checkpoint_every_n_steps: 2

wandb:
  project: BasisLearning-vibration-modes
  tags:
    material: airplane
    method: heat_qform
