defaults:
  - function_generator: fourier_2d # the forward problem
  - diffeomorphism: kumaraswamy
  - orthogonal_synthesis@orthogonal_synthesis_partial: identity
  - dictionaries@initial_atoms: fourier_2d
  - hydra: default
  - wandb: disabled # set to enabled for wandb logging
  - _self_
  - override hydra/hydra_logging: none # hack to fix the logging code
  - override hydra/job_logging: none # hack to fix the logging code

# training hyperparameters
n_epochs: 5000_00
domain_sample_size: 100

optimizer:
  _target_: torch.optim.Adam
  lr: 0.0001
  _partial_: true

scheduler: null

n_functions: 1000
batch_size: 100
grad_accumulation_steps: 10
loss_smoothing_alpha: 0.99
n_reduced_order: null
