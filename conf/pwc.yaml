defaults:
  - neural_isometry: infinitesimal_givens
  - dictionaries@initial_dictionary: fourier_2d
  - index_sampler: geometric_static
  - regularizer: entropy
  - hydra: default
  - wandb: enabled # set to enabled for wandb logging
  - _self_
  - override hydra/hydra_logging: none # hack to fix the logging code
  - override hydra/job_logging: none # hack to fix the logging code

isometry_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true
isometry_scheduler_callable: null

atom_index_batch_size: 512
grad_accumulation_steps: 1
reg_lambda: 1.0
fidelity_lambda: 1.0

# training hyperparameters
n_epochs: 50000
domain_sample_size: 1000

callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    n_truncation: 10
    frequency: 200
    density: 1000_00
    

# Add tags so that it is easier to filter the experiments in the W&B dashboard
wandb:
  tags:
    experiment: pwc
    task: pwc

