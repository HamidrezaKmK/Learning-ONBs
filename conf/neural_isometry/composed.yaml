# compose householder and half-density transforms
defaults:
  - /diffeomorphisms@lagrangian.diffeomorphism: ct_radial
  - _self_

_target_: infidictionary.neural_isometries.ComposedIsometry

initial_diffeomorphism: 
  _target_: infidictionary.diffeomorphisms.IdentityFlow

eulerian:
  _target_: infidictionary.neural_isometries.HouseholderIsometry
  domain_dim: 2
  n_reflections: 9
lagrangian:
  _target_: infidictionary.neural_isometries.HalfDensityIsometry
