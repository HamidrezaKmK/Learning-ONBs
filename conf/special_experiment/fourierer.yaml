# @package _global_
#
# Regularized change-of-basis experiment using the Fourierer vibration scheme.
#
# Three regularizers act together:
#   - FouriererVibration: heat-kernel QF on inside/outside domain per parity.
#   - FouriererMasking:   both channels zero in the inactive region per parity.
# Usage:
#   python regularized_change_of_basis.py +experiment=special_fourierer_vibration

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: fourier_mixture
  - _self_

# Two-channel dictionary so atoms have shape (N, 2); isometry must match.
initial_dictionary:
  num_channels: 2
  p: 0.15

neural_isometry:
  channels_dim: 2

model_state_kwargs:
  num_steps: 50


tail_probability: 0.0007
num_tail_samples: 32
grad_accumulation_steps: 8

regularizers:
  # vibration:
  #   weight: 1.0
  #   _target_: infidictionary.regularizers.FouriererVibration
  #   smoothing_t: 0.05
  #   n_diffusion_samples: 4
  #   mass_threshold: 0.5
  #   exterior_mass_eps: 0.01
  #   material:
  #     _target_: infidictionary.material.JosephFourierMaterial
  #     image_path: assets/Joseph_Fourier.jpg
  #     image_size: 256
  #     min_diffusivity: 1.0
  #     max_diffusivity: 1.0
  #     invert: false
  #     threshold: 0.5
  #     sigma: 0.002
  #     exterior_mass: 0.01
  #   domain_sampler:
  #     _target_: infidictionary.domain_samplers.SquareSampler
  #     stratified: true
  #     add_noise: true
  #   domain_sample_size: 32

  masking:
    weight: 1.0
    _target_: infidictionary.regularizers.FouriererMasking
    mass_threshold: 0.5
    diversity_weight: 1.0
    n_diversity_pairs: 8
    material:
      _target_: infidictionary.material.JosephFourierMaterial
      image_path: assets/Joseph_Fourier.jpg
      image_size: 256
      min_diffusivity: 1.0
      max_diffusivity: 1.0
      invert: false
      threshold: 0.5
      sigma: 0.002
      exterior_mass: 0.01
    domain_sampler:
      _target_: infidictionary.domain_samplers.SquareSampler
      stratified: true
      add_noise: true
    domain_sample_size: 128

n_epochs: 200000

adaptive_weighting:
  enabled: false
  ema_decay: 0.99

callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler: ${domain_sampler}
    frequency: 100
    density: 100
    indices:
      - [ 0,  0, 0]
      - [ 1,  0, 0]
      - [ 0,  1, 0]
      - [ 0,  0, 1]
      - [-1,  0, 1]
      - [ 0, -1, 1]

wandb:
  tags:
    experiment: regularized_change_of_basis
    regularizer: fourierer_vibration
