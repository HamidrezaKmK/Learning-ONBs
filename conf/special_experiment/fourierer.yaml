# @package _global_
#
# Regularized change-of-basis experiment using the Fourierer vibration scheme.
#
# Usage:
#   python reg_cob.py +special_experiment=fourierer

defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: old
  - _self_

# Two-channel dictionary so atoms have shape (N, 2); isometry must match.
initial_dictionary:
  num_channels: 2
  steepness: 2.0
  tiebreak_eps: 1.0e-3

neural_isometry:
  channels_dim: 2

model_state_kwargs:
  num_steps: 50

tail_probability: 0.0007
num_tail_samples: 32
grad_accumulation_steps: 8

regularizer:
  _target_: infidictionary.regularizers.FouriererRegularizer
  smoothing_t: 0.05
  n_diffusion_samples: 4
  masking_weight: 1.0
  diversity_weight: 1.0
  vibration_weight: 0.0 # TODO: This is important maybe we should remove the whole piece of code with the vibration
  mass_threshold: 0.5
  exterior_mass_eps: 0.01
  material:
    _target_: infidictionary.material.JosephFourierMaterial
    image_path: assets/Joseph_Fourier.jpg
    image_size: 256
    interior_diffusivity: 1.0
    exterior_diffusivity: 1.0
    invert: false
    threshold: 0.5
    sigma: 0.002
    exterior_mass: 0.01
  domain_sampler:
    _target_: infidictionary.domain_samplers.SquareSampler
    stratified: true
    add_noise: true
  domain_sample_size: 128

n_epochs: 200000

callbacks:
  isometry_check:
    _target_: infidictionary.callbacks.IsometryCheck
    dictionary: ${initial_dictionary}
    domain_sampler: ${domain_sampler}
    frequency: 100
    density: 100
    indices:
      - [ 0,  0, 0]
      - [ 1,  0, 0]
      - [ 0,  1, 0]
      - [ 0,  0, 1]
      - [-1,  0, 1]
      - [ 0, -1, 1]

wandb:
  project: BasisLearning-Fourierer
