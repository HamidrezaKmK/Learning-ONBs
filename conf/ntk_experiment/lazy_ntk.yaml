# @package _global_
#
# NTK regularizer at random initialisation (lazy / NTK regime).
#
# The ntk_model is a large NTK-parameterised MLP with random weights.
# No pre-trained weights are loaded; the NTK is that of a randomly
# initialised network, which corresponds to the infinite-width NTK.
#
# Usage:
#   python reg_cob.py +ntk_experiment=lazy_ntk
defaults:
  - override /neural_fields@neural_isometry.scalar_field_partial: fourier_mixture
  - _self_

# Two-channel dictionary so atoms have shape (N, 2); isometry must match.
initial_dictionary:
  num_channels: 1
  steepness: 2.0
  tiebreak_eps: 1.0e-3

neural_isometry:
  channels_dim: 1

model_state_kwargs:
  num_steps: 50

tail_probability: 0.0007
num_tail_samples: 32
grad_accumulation_steps: 1

regularizer:
  _target_: infidictionary.regularizers.NTKRegularizer
  ntk_model_weights_path: null
  ntk_model:
    _target_: infidictionary.networks.NTKMLPNeuralField
    input_dim: 2
    output_dim: 1
    hidden_dims:
      a: 1024
      b: 1024
      c: 1024
    n_fourier_features: 0
    fourier_sigma: 0.0
    activation:
      _target_: torch.nn.Tanh
      _partial_: true
  domain_sampler:
    _target_: infidictionary.domain_samplers.SquareSampler
    stratified: true
    add_noise: true
  domain_sample_size: 32
